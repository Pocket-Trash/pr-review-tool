name: Pocket Trash PR review dispatcher

on:
  workflow_call:
    inputs:
      config-path:
        description: Trusted configuration path on the base SHA
        required: false
        default: .github/pr-review.json
        type: string
      app-id:
        description: Pocket Trash PR Review GitHub App ID
        required: true
        type: string
      app-slug:
        description: Expected GitHub App slug
        required: false
        default: pockettrash
        type: string
    secrets:
      CHEAPER_INFERENCE_API_KEY:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runnable: ${{ steps.authorize.outputs.runnable }}
      pull-number: ${{ steps.authorize.outputs.pull-number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: reviewer
          persist-credentials: false
      - id: authorize
        name: Authorize review event
        run: node reviewer/src/preflight.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_AUTHORIZE_ONLY: "true"

  review:
    needs: authorize
    if: needs.authorize.outputs.runnable == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/run-review.yml
    with:
      app-id: ${{ inputs.app-id }}
      app-slug: ${{ inputs.app-slug }}
      config-path: ${{ inputs.config-path }}
      pull-number: ${{ fromJSON(needs.authorize.outputs.pull-number) }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CHEAPER_INFERENCE_API_KEY: ${{ secrets.CHEAPER_INFERENCE_API_KEY }}
