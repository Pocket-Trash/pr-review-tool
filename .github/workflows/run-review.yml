name: Pocket Trash authorized PR analysis

on:
  workflow_call:
    inputs:
      task:
        required: false
        default: visuals
        type: string
      infisical-project-id:
        description: Infisical project ID for OIDC credential reads
        required: false
        default: ""
        type: string
      infisical-environment:
        required: false
        default: preview
        type: string
      infisical-path:
        required: false
        default: /tools/github/pr-review-tool
        type: string
      config-path:
        required: true
        type: string
      app-id:
        required: true
        type: string
      app-slug:
        required: true
        type: string
      pull-number:
        required: true
        type: number
    secrets:
      INFISICAL_GITHUB_IDENTITY_ID:
        required: false
      INFISICAL_DOMAIN:
        required: false
      INFISICAL_OIDC_AUDIENCE:
        required: false
      CHEAPER_INFERENCE_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  REVIEW_TASK: ${{ inputs.task }}
  REVIEW_VISUAL_PHASE: "1"
  REVIEW_CODE_ENABLED: "false"
  REVIEW_ARTIFACT_LIMIT_BYTES: "524288"

concurrency:
  group: pr-${{ inputs.task }}-${{ github.repository }}-${{ inputs.pull-number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFISICAL_GITHUB_IDENTITY_ID: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      review-enabled: ${{ env.REVIEW_CODE_ENABLED }}
      publish: ${{ steps.preflight.outcome == 'failure' || steps.preflight.outputs.runnable == 'true' }}
      pull-number: ${{ steps.preflight.outputs.pull-number || inputs.pull-number }}
      head-sha: ${{ steps.preflight.outputs.head-sha || github.event.pull_request.head.sha }}
      artifact-key: ${{ steps.preflight.outputs.head-sha || github.event.pull_request.head.sha || github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: reviewer
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: preflight
        name: Validate event and trusted configuration
        continue-on-error: true
        run: node reviewer/src/preflight.mjs 2> "${{ runner.temp }}/preflight-error.log"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_CONFIG_PATH: ${{ inputs.config-path }}
      - name: Install pinned review skills
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.runnable == 'true'
        working-directory: reviewer
        run: npm run skills:install
      - name: Install pinned reviewer dependencies
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.runnable == 'true'
        working-directory: reviewer
        run: npm ci --ignore-scripts
      - id: model-credential
        # OIDC mode never reads the App key or the entire Infisical folder.
        name: Fetch model credential from Infisical
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.runnable == 'true' && env.INFISICAL_GITHUB_IDENTITY_ID != ''
        continue-on-error: true
        run: node reviewer/src/infisical.mjs analysis 2> "${{ runner.temp }}/review-error.log"
        env:
          REVIEW_PROVIDER: ${{ steps.preflight.outputs.provider }}
          INFISICAL_PROJECT_ID: ${{ inputs.infisical-project-id }}
          INFISICAL_ENVIRONMENT: ${{ inputs.infisical-environment }}
          INFISICAL_SECRET_PATH: ${{ inputs.infisical-path }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          INFISICAL_OIDC_AUDIENCE: ${{ secrets.INFISICAL_OIDC_AUDIENCE }}
      - id: review
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.runnable == 'true' && steps.model-credential.outcome != 'failure'
        continue-on-error: true
        run: node reviewer/src/automatic-review.mjs 2> "${{ runner.temp }}/review-error.log"
        env:
          CHEAPER_INFERENCE_API_KEY: ${{ steps.preflight.outputs.provider == 'cheaperinference' && (env.CHEAPER_INFERENCE_API_KEY || secrets.CHEAPER_INFERENCE_API_KEY) || '' }}
          OPENROUTER_API_KEY: ${{ steps.preflight.outputs.provider == 'openrouter' && (env.OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/review-result.json
          REVIEW_CONFIG_PATH: ${{ inputs.config-path }}
      - name: Record analysis failure
        if: always() && steps.preflight.outputs.runnable == 'true'
        run: >-
          node reviewer/src/analysis-status.mjs
          "${{ steps.review.outcome }}"
          "${{ runner.temp }}/review-error.log"
          "${{ runner.temp }}/review-result.json"
      - name: Record preflight failure
        if: always() && steps.preflight.outcome == 'failure'
        run: >-
          node reviewer/src/analysis-status.mjs
          failure
          "${{ runner.temp }}/preflight-error.log"
          "${{ runner.temp }}/review-result.json"
      - if: always() && (steps.preflight.outcome == 'failure' || steps.preflight.outputs.runnable == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-${{ inputs.task }}-${{ steps.preflight.outputs.pull-number || inputs.pull-number }}-${{ steps.preflight.outputs.head-sha || github.event.pull_request.head.sha || github.run_id }}
          path: ${{ runner.temp }}/review-result.json
          retention-days: 90
      - name: Preserve analysis failure state
        if: always() && (steps.preflight.outcome == 'failure' || steps.model-credential.outcome == 'failure' || steps.review.outcome == 'failure')
        run: exit 1

  publish:
    if: always() && (inputs.task != 'review' || needs.review.outputs.review-enabled == 'true') && (needs.review.outputs.publish == 'true' || needs.review.result == 'failure' || needs.review.result == 'cancelled')
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INFISICAL_GITHUB_IDENTITY_ID: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: reviewer
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          name: pr-${{ inputs.task }}-${{ needs.review.outputs.pull-number }}-${{ needs.review.outputs.artifact-key }}
          path: ${{ runner.temp }}/review-artifact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: app-credential
        name: Fetch App credential from Infisical
        if: env.INFISICAL_GITHUB_IDENTITY_ID != ''
        run: node reviewer/src/infisical.mjs publication
        env:
          INFISICAL_PROJECT_ID: ${{ inputs.infisical-project-id }}
          INFISICAL_ENVIRONMENT: ${{ inputs.infisical-environment }}
          INFISICAL_SECRET_PATH: ${{ inputs.infisical-path }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          INFISICAL_OIDC_AUDIENCE: ${{ secrets.INFISICAL_OIDC_AUDIENCE }}
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ env.PR_REVIEW_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-issues: write
      - name: Publish persistent visual comment and check
        run: node reviewer/src/publish-review.mjs
        env:
          ANALYSIS_CONCLUSION: ${{ needs.review.result == 'cancelled' && 'cancelled' || 'failure' }}
          GITHUB_AUTHENTICATED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_SLUG: ${{ inputs.app-slug }}
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_HEAD_SHA: ${{ needs.review.outputs.head-sha }}
          REVIEW_PULL_NUMBER: ${{ needs.review.outputs.pull-number }}
          REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/review-artifact/review-result.json
